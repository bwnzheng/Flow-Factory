# JSR analysis using this tool's run outputs. Missing/incomplete run outputs
# trigger fresh generation and reward scoring, then are reused on later runs.
model:
  base_model: "unused-for-cached-jsr"

evaluation:
  num_samples_per_prompt: 16
  generation_batch_size: 1
  reward_batch_size: 16
  seed: 42
  num_inference_steps: 40
  guidance_scale: 1.0
  height: 512
  width: 512

sources:
  - name: "pickscore"
    prompts_file: "dataset/pickscore/test.txt"
    max_prompts: 100
    rewards:
      - {name: "pick_score", reward_model: "PickScore"}
      - {name: "clip_score", reward_model: "CLIP"}

runs:
  - {name: "base", label: "Base", base_model_only: true}
  - {name: "weighted_sum", label: "Weighted Sum", checkpoint: "saves/weighted_sum/checkpoint-60"}
  - {name: "src_reweight", label: "SRC-Reweight", checkpoint: "saves/src_reweight/checkpoint-60"}

jsr:
  enabled: true
  reference_run: "base"
  comparison_runs: ["weighted_sum", "src_reweight"]
  q_grid: [0.0, 0.5, 0.8, 0.9, 0.95, 1.0]
  bootstrap_replicates: 2000
  bootstrap_seed: 123

output:
  cache_dir: "analysis_cache/eval_reward_analysis/jsr_cached"
  jsr_dir: "analysis_output/eval_reward_analysis/jsr_cached"
  plot_format: "png"
