# Fresh checkpoint-rollout reward analysis (covariance and optional JSR).
#
# This tool never reads training reward PKLs.  It generates repeated samples
# from one or more saved LoRA checkpoints, scores every generated image with
# the configured reward models, and computes all covariance statistics inside
# each prompt before macro-averaging across prompts.

model:
  base_model: "stabilityai/stable-diffusion-3.5-medium"
  dtype: "bfloat16"
  device: null  # Auto-detect NPU, then CUDA, then CPU; an explicit index is also valid.
  num_processes: 1  # One worker per accelerator; set >1 only for idle GPUs.

evaluation:
  num_samples_per_prompt: 16  # At least 16 is recommended for 3+ rewards.
  generation_batch_size: 1
  reward_batch_size: 16
  seed: 42
  num_inference_steps: 40
  guidance_scale: 1.0
  height: 512
  width: 512

# Use source-specific reward suites.  A reward must be present for every
# generated image in its source; the tool will reject partial reward vectors.
sources:
  - name: "pickscore"
    prompts_file: "dataset/pickscore/test.txt"
    max_prompts: 100  # Maximum prompts loaded from this source; 0 evaluates all prompts.
    rewards:
      - name: "pick_score"
        reward_model: "PickScore"
      - name: "clip_score"
        reward_model: "CLIP"

  - name: "ocr"
    prompts_file: "dataset/ocr/test.txt"
    max_prompts: 100
    rewards:
      - name: "pick_score"
        reward_model: "PickScore"
      - name: "clip_score"
        reward_model: "CLIP"
      - name: "ocr_reward"
        reward_model: "OCR"

  # - name: "geneval"
  #   prompts_file: "dataset/geneval/test.jsonl"
  #   prompt_key: "prompt"
  #   max_prompts: 100
  #   rewards:
  #     - name: "pick_score"
  #       reward_model: "PickScore"
  #     - name: "clip_score"
  #       reward_model: "CLIP"
  #     - name: "geneval_reward"
  #       reward_model: "GenEval"  # Use "geneval_ascend" on NPU.

runs:
  # For a base-model evaluation, use base_model_only: true instead of
  # checkpoint. Only the agreement counts need scalarization weights, so a base
  # model borrows them from the checkpoint runs configured alongside it, here
  # through their logs/media.jsonl run_context -- the same source the
  # training-side analysis reads. Covariance and JSR never need any.
  - name: "example_run"
    label: "example"
    checkpoint: "saves/example_run/checkpoints/checkpoint-60"
    # Optional override, resolved in this order: this field, then the run's own
    # saved run context, then, for a base_model_only run, the run contexts of
    # the configured checkpoint runs, which must agree. A single override covers
    # one source's reward list, so name every reward of every source it applies
    # to or leave it out and let the run contexts supply per-source weights.
    # reward_weights: {pick_score: 0.2, clip_score: 0.2, ocr_reward: 1.0}

# Agreeing-count statistics: the only ones that compare each reward against the
# weighted scalar, and the only ones that resolve reward weights. Turn them off
# to evaluate a base model without any training log or weight override.
agreement_count:
  enabled: true

output:
  dir: "analysis_output/eval_reward_analysis"
  plot_format: "png"  # Figure format: png or pdf.
  # regenerate rebuilds every figure from the analysis; reuse redraws each figure
  # from the <stem>.json beside it and skips the analysis entirely, so restyling
  # costs no generation or scoring. This never affects the image and reward
  # caches: those are always reused when they exist. Override per invocation with
  # --figures reuse.
  figure_mode: "regenerate"
