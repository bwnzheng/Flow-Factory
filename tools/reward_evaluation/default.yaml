# Standalone checkpoint reward evaluation.
#
# Images are generated by tools.model_inference and every configured reward is
# loaded dynamically through flow_factory.rewards.registry. Replace the paths
# below before running this template.

model:
  base_model: "stabilityai/stable-diffusion-3.5-medium"
  dtype: "bfloat16"
  device: null  # Auto-detect NPU, then CUDA, then CPU.
  num_processes: 1

evaluation:
  num_samples_per_prompt: 4
  generation_batch_size: 1
  reward_batch_size: 4
  seed: 42
  num_inference_steps: 40
  guidance_scale: 1.0
  height: 512
  width: 512

sources:
  # These sources mirror data.datasets in
  # examples/nft/lora/sd3_5/8xnpu_5reward.yaml. With split: test, the tool
  # resolves dataset/<source>/test.jsonl or test.txt exactly as training eval.
  - name: "pickscore"
    dataset_dir: "dataset/pickscore"
    split: "test"
    prompt_key: "prompt"
    max_prompts: 0
    rewards:
      # General rewards apply to every training eval source.
      - name: "pick_score"
        reward_model: "pickscore"
      - name: "hpsv2"
        reward_model: "hpsv2"
      - name: "clip_score"
        reward_model: "clip"
      - name: "unireward"
        reward_model: "unireward"
        batch_size: 1
        extra_kwargs:
          backend: "v2.0"
          model_path: "CodeGoat24/UnifiedReward-2.0-qwen-7b"
          return_dimensions: true
      - name: "vision_reward"
        reward_model: "vision_reward"
        batch_size: 1
        extra_kwargs:
          repo_path: "VisionReward"
          model_path: "THUDM/VisionReward-Image-bf16"
          # Use a local snapshot, or select a public Llama-3-compatible repo:
          # tokenizer_path: "/path/to/llama3-compatible-tokenizer"
          # tokenizer_repo: "hfl/llama-3-chinese-8b-instruct-v3"
          # tokenizer_local_files_only: false

  - name: "geneval"
    dataset_dir: "dataset/geneval"
    split: "test"
    prompt_key: "prompt"
    max_prompts: 0
    rewards:
      - name: "pick_score"
        reward_model: "pickscore"
      - name: "hpsv2"
        reward_model: "hpsv2"
      - name: "clip_score"
        reward_model: "clip"
      - name: "unireward"
        reward_model: "unireward"
        batch_size: 1
        extra_kwargs:
          backend: "v2.0"
          model_path: "CodeGoat24/UnifiedReward-2.0-qwen-7b"
          return_dimensions: true
      - name: "vision_reward"
        reward_model: "vision_reward"
        batch_size: 1
        extra_kwargs:
          repo_path: "VisionReward"
          model_path: "THUDM/VisionReward-Image-bf16"
          # tokenizer_path: "/path/to/llama3-compatible-tokenizer"
          # tokenizer_repo: "hfl/llama-3-chinese-8b-instruct-v3"
          # tokenizer_local_files_only: false
      - name: "geneval"
        reward_model: "geneval_ascend"

  - name: "ocr"
    dataset_dir: "dataset/ocr"
    split: "test"
    prompt_key: "prompt"
    max_prompts: 0
    rewards:
      - name: "pick_score"
        reward_model: "pickscore"
      - name: "hpsv2"
        reward_model: "hpsv2"
      - name: "clip_score"
        reward_model: "clip"
      - name: "unireward"
        reward_model: "unireward"
        batch_size: 1
        extra_kwargs:
          backend: "v2.0"
          model_path: "CodeGoat24/UnifiedReward-2.0-qwen-7b"
          return_dimensions: true
      - name: "vision_reward"
        reward_model: "vision_reward"
        batch_size: 1
        extra_kwargs:
          repo_path: "VisionReward"
          model_path: "THUDM/VisionReward-Image-bf16"
          # tokenizer_path: "/path/to/llama3-compatible-tokenizer"
          # tokenizer_repo: "hfl/llama-3-chinese-8b-instruct-v3"
          # tokenizer_local_files_only: false
      - name: "ocr"
        reward_model: "ocr"

  # Add other registry rewards in the source where they apply.

runs:
  - name: "example_run"
    label: "example"
    # Evaluate every checkpoint-N directory under this run.
    checkpoint_dir: "saves/example_run/checkpoints"

output:
  dir: "analysis_output/reward_evaluation"
